{{ define "main" }}
<article class="prose">
  {{- /* The first heading is the page's title, shown once. */ -}}
  <h1>{{ partial "title.html" . }}</h1>
  {{ replaceRE `(?s)^\s*<h1[^>]*>.*?</h1>` "" .Content 1 | safeHTML }}
  <footer class="source">
    <a href="{{ site.Params.repository }}/blob/main/{{ partial "source.html" . }}">{{ partial "source.html" . }} on GitHub</a>
  </footer>
</article>
{{ end }}
