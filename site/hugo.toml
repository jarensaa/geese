# The documentation site, built from the repository's own Markdown: docs/ and
# PROTOCOL.md. Its home page (content/) is its own; the README is GitHub's.
# Build with `hugo --source site` (CI: .github/workflows/pages.yml).
baseURL = "https://jarensaa.github.io/geese/"
title = "geese"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]
enableRobotsTXT = false

[params]
  description = "Live schema migrations for a flock of processes on one PostgreSQL database."
  repository = "https://github.com/jarensaa/geese"
  reference = "https://pkg.go.dev/github.com/jarensaa/geese"

[markup.goldmark.parser]
  autoHeadingIDType = "github"
[markup.highlight]
  noClasses = false

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../PROTOCOL.md"
    target = "content/protocol.md"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    files = ["! assets/**"]
  [[module.mounts]]
    source = "../docs/assets"
    target = "static/docs/assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

